trigger:
  - master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'GiftofGivers-Azure'
  webAppName: 'GiftofGivers'
  functionAppName: 'GiftofGivers1'
  sqlServerName: 'semiserver.database.windows.net'
  sqlDatabaseName: 'GIFTDB'
  sqlAdminUser: 'admin1'
  # sqlAdminPassword -> SECRET variable: Pipelines > Edit > Variables > New variable > tick "Keep this value secret"

stages:
- stage: Build_Test
  displayName: 'Build and Test'
  jobs:
  - job: Build_Test_Job
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # No private feed any more: GiftofGivers.Helpers is a ProjectReference, so only nuget.org is used.
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: |
          **/GiftofGivers.csproj
          **/GiftofGivers.Functions.csproj
          **/GiftofGivers.Tests.csproj

    - task: DotNetCoreCLI@2
      displayName: 'Build Web and Test projects'
      inputs:
        command: 'build'
        projects: |
          **/GiftofGivers.csproj
          **/GiftofGivers.Tests.csproj
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # Selenium project is not run in CI (needs a live site + browser); load test excluded.
    - task: DotNetCoreCLI@2
      displayName: 'Run unit and integration tests'
      inputs:
        command: 'test'
        projects: '**/GiftofGivers.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --filter "FullyQualifiedName!~LoadTest" --collect:"XPlat Code Coverage"'
        publishTestResults: true
        testRunTitle: 'GiftofGivers unit and integration tests'

    - task: DotNetCoreCLI@2
      displayName: 'Publish web app'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/GiftofGivers.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web --no-build'
        zipAfterPublish: true
        modifyOutputPath: false

    - publish: $(Build.ArtifactStagingDirectory)/web
      artifact: web
      displayName: 'Upload web artifact'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Azure Functions'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/GiftofGivers.Functions.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/functions'
        zipAfterPublish: true
        modifyOutputPath: false

    - publish: $(Build.ArtifactStagingDirectory)/functions
      artifact: functions
      displayName: 'Upload functions artifact'

    # ---- C.3: generate an idempotent SQL script from the EF Core migrations
    - script: dotnet tool install --global dotnet-ef --version 8.0.10
      displayName: 'Install dotnet-ef'

    - script: echo ##vso[task.prependpath]%USERPROFILE%\.dotnet\tools
      displayName: 'Add dotnet tools to PATH'

    - script: dotnet ef migrations script --idempotent --project GiftofGivers/GiftofGivers/GiftofGivers.csproj --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/sql/migrate.sql
      displayName: 'Generate SQL migration script'
      env:
        ConnectionStrings__DefaultConnection: 'Server=ci-placeholder;Database=ci;'   # only selects the SQL Server provider; nothing connects

    - publish: $(Build.ArtifactStagingDirectory)/sql
      artifact: sql
      displayName: 'Upload SQL artifact'

- stage: Deploy_SQL
  displayName: 'Deploy SQL schema'
  dependsOn: Build_Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: DeploySql
    environment: 'production'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: SqlAzureDacpacDeployment@1
            displayName: 'Apply EF migration script to Azure SQL'
            inputs:
              azureSubscription: '$(azureSubscription)'
              AuthenticationType: 'server'
              ServerName: '$(sqlServerName)'
              DatabaseName: '$(sqlDatabaseName)'
              SqlUsername: '$(sqlAdminUser)'
              SqlPassword: '$(sqlAdminPassword)'
              deployType: 'SqlTask'
              SqlFile: '$(Pipeline.Workspace)/sql/migrate.sql'
              IpDetectionMethod: 'AutoDetect'

- stage: Deploy_Web
  displayName: 'Deploy Web App'
  dependsOn: Deploy_SQL
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: DeployWebApp
    environment: 'production'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webApp'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/web/*.zip'

- stage: Deploy_Functions
  displayName: 'Deploy Azure Functions'
  dependsOn: Build_Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: functions
    environment: 'production'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureFunctionApp@2
            displayName: 'Deploy Function App'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'functionAppLinux'        # your publish profile says IsLinux=true
              appName: '$(functionAppName)'
              package: '$(Pipeline.Workspace)/functions/*.zip'
              runtimeStack: 'DOTNET-ISOLATED|8.0'
              # If the Function App is on the FLEX CONSUMPTION plan, remove runtimeStack and add:
              # isFlexConsumption: true
