# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core


# ASP.NET Core (.NET 8) - Build and test Gift of the Givers

trigger:
  - master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/GiftofGivers.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'

- task: NuGetAuthenticate@1
  displayName: 'Authenticate with Azure Artifacts'

- task: NuGetCommand@2
  displayName: 'Restore NuGet packages'
  inputs:
    restoreSolution: '$(solution)'
    feedsToUse: 'config'
    nugetConfigPath: 'GiftofGivers/nuget.config'

- task: VSBuild@1
  displayName: 'Build solution'
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run unit and integration tests'
  inputs:
    command: 'test'
    projects: 'GiftofGivers.Tests/GiftofGivers.Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --filter "FullyQualifiedName!~LoadTest" --collect:"XPlat Code Coverage"'
    publishTestResults: true
    testRunTitle: 'GiftofGivers unit and integration tests'
